[tool.poetry]
name = "opensearch-chain"
version = "0.9.0a0"
description = "A simple chain that connects to Opensearch service and processes the result of a search"
authors = []

[tool.poetry.dependencies]
python = "^3.14"
genai-core = "0.9.0"
# already included in genai-core but we set a fixed version
langchain = "1.4.7"
langgraph = "1.2.18"
langchain-openai = "1.7.3"
opentelemetry-sdk = "1.44.0"
opentelemetry-exporter-otlp-proto-grpc = "1.44.0"
opentelemetry-instrumentation-fastapi = "0.65b0"
opentelemetry-instrumentation-httpx = "0.65b0"
setuptools = "84.2.1" # in main group so it is bundled in the FAT package (offline installs)

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-asyncio = "1.4.1"
pytest-mock = "3.17.0"
pytest-cov = "7.1.0"
pylint = "4.1.3"
pylintfileheader = "1.1.0"
black = "26.10.1"
isort = "9.0.2"
mypy = "2.4.1"

[tool.poetry.scripts]
build-fat-package = 'genai_core.builder.builder:main'
local-env = 'genai_core.local_env.local_env:main'

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = ["manual: to mark tests as manual"]
addopts = "-m 'not manual'"

[[tool.poetry.source]]
name = "stratio-releases"
# Here you should replace the existing Url, with the genai-api-development-proxy url.
# See also example-chain-basic-actor/README.md
#url = "https://genai-developer-proxy-loadbalancer.s000001-genai.k8s.fifteen.labs.stratio.com:8080/service/genai-api/v1/pypi/simple/"
url = "http://qa.int.stratio.com/repository/python-releases/simple/"
priority = "supplemental"

[tool.coverage.run]
omit = [
    "tests/*",
    "scripts/*",
]

[tool.pylint.main]
py-version = "3.14"
ignore-patterns = ["^\\.#"]
ignore-paths = [
    "^tests$",
    "^tests/.*$",
    "^scripts/.*$",
]
load-plugins = ["pylintfileheader"]
file-header = "[\\S\\n\\t\\v ]+© 2025 Stratio Big Data Inc."
file-header-ignore-empty-files = true

[tool.pylint.basic]
no-docstring-rgx = "^_"

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "use-symbolic-message-instead",
    "too-few-public-methods"
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.variables]
ignored-argument-names = "_.*|^ignored_|^unused_"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
